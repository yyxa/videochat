  postgresql:
    container_name: postgresql
    image: postgres:latest
    env_file: 
      - ./databases/postgresql/db.env
    volumes:
      - ./databases/postgresql/init/:/docker-entrypoint-initdb.d
      - ./databases/postgresql/data:/var/lib/postgresql/data
    restart: always
    # healthcheck:
    #   test: ["executable", "arg"]
    #   interval: 1m30s
    #   timeout: 30s
    #   retries: 5
    #   start_period: 30s
    ports:
      - 5432:5432

  redis:
    container_name: redis
    image: redis:latest
    volumes:
      - ./databases/redis/data:/redis/data
    restart: always
        # healthcheck:
    #   test: ["executable", "arg"]
    #   interval: 1m30s
    #   timeout: 30s
    #   retries: 5
    #   start_period: 30s
    ports:
      - 6379:6379

